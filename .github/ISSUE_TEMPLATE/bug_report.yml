name: Bug report
description: Something in this repository doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Git Gud Gym v0.3.1, module v0.3.0, SDK v0.1.0"
